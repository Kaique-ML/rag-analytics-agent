version: "3.9"
services:
  app:
    build: .
    ports:
      - "8501:8501"
    env_file: .env
    volumes:
      - ./data:/app/data
    command: streamlit run app/main.py

  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    command: uvicorn app.api.routes:app --host 0.0.0.0 --port 8000
